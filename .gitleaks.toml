# Gitleaks configuration for the CI secret-scan job.
#
# The repository documents deterministic development/test credentials
# (Admin123, Student123, Teacher123) in fixtures, E2E specs, CI environment
# blocks, and docs. These are not real secrets; they are allowlisted here so the
# scan only fails on genuine credentials.

[allowlist]
  description = "Documented development and test credential literals"
  regexes = [
    '''(?i)\b(admin123|student123|teacher123)\b''',
  ]
  paths = [
    '''\.github/''',
    '''tests/''',
    '''TEST_SCENARIOS/''',
    '''src/frontend/e2e/''',
    '''src/frontend/tests/''',
    '''docs/''',
    '''README\.md''',
    '''CONTINUE_PROMPT.*\.md''',
  ]
