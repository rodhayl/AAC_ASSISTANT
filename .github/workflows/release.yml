name: Release

# Builds, signs, smokes, and publishes the Windows installer and portable
# zip when a release tag (v*) is pushed. Signing requires the repository
# secrets RELEASE_SIGNING_PFX_BASE64 and RELEASE_SIGNING_PFX_PASS (the PFX
# exported by scripts/sign_release.ps1 via AAC_SIGNING_PFX). Without the
# secrets the artifacts are published unsigned and the job still succeeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      ENVIRONMENT: test
      # Deliberately no TESTING=1: the smoke step exercises the rate limiter,
      # mirroring the packaging-windows job in ci.yml.
      JWT_SECRET_KEY: ci-package-secret-key-with-at-least-32-characters
      AAC_BOOTSTRAP_ADMIN_ON_FIRST_RUN: "true"
      AAC_BOOTSTRAP_ADMIN_USERNAME: admin1
      AAC_BOOTSTRAP_ADMIN_PASSWORD: Admin123
      AAC_ASSISTANT_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: astral-sh/setup-uv@ae3b92d1bdb308a10adfe7b8f408e5cc8c30f3f6 # v6
        with:
          version: latest
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Read the release version from pyproject.toml
        # Single source of truth: installer/portable names, the packaged smoke
        # assertion and the signing paths all read this value.
        shell: pwsh
        run: |
          "APP_VERSION=$(uv version --short)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "${env:ProgramFiles}\Inno Setup 6",
            "C:\Program Files (x86)\Inno Setup 6"
          )
          foreach ($dir in $candidates) {
            if ($dir -and (Test-Path "$dir\ISCC.exe")) {
              "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              "INNO_SETUP_PATH=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              break
            }
          }

      - run: uv sync --locked --group dev
      - run: npm ci
        working-directory: src/frontend

      - name: Build PyInstaller and Inno release
        shell: cmd
        run: build_package.bat

      - name: Detect signing secrets
        id: signcheck
        shell: bash
        env:
          RELEASE_SIGNING_PFX_BASE64: ${{ secrets.RELEASE_SIGNING_PFX_BASE64 }}
          RELEASE_SIGNING_PFX_PASS: ${{ secrets.RELEASE_SIGNING_PFX_PASS }}
        run: |
          if [ -n "$RELEASE_SIGNING_PFX_BASE64" ] && [ -n "$RELEASE_SIGNING_PFX_PASS" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SIGNING_PFX_BASE64 / RELEASE_SIGNING_PFX_PASS are not configured; publishing unsigned artifacts."
          fi

      - name: Import signing certificate
        if: steps.signcheck.outputs.has_secrets == 'true'
        shell: powershell
        env:
          RELEASE_SIGNING_PFX_BASE64: ${{ secrets.RELEASE_SIGNING_PFX_BASE64 }}
          RELEASE_SIGNING_PFX_PASS: ${{ secrets.RELEASE_SIGNING_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:RELEASE_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_SIGNING_PFX_PASS -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath -Force
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Imported signing certificate $($cert.Subject) ($($cert.Thumbprint))"

      - name: Sign release artifacts
        if: steps.signcheck.outputs.has_secrets == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign_release.ps1 `
            -ExePath "dist\AAC_Assistant\AAC_Assistant.exe" `
            -InstallerPath "dist\AAC_Assistant_Setup_$env:APP_VERSION.exe" `
            -Thumbprint "$env:SIGNING_THUMBPRINT" `
            -SkipTrustImport

      - name: Verify Authenticode signatures
        if: steps.signcheck.outputs.has_secrets == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            "dist\AAC_Assistant\AAC_Assistant.exe",
            "dist\AAC_Assistant_Setup_$env:APP_VERSION.exe"
          )
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $target
            if ($sig.Status -ne 'Valid') {
              throw "$target signature status: $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "Valid: $target (signer: $($sig.SignerCertificate.Subject))"
          }

      - name: Package portable zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Zip AFTER signing so the portable copy ships the signed executable.
          Compress-Archive -Path 'dist\AAC_Assistant' `
            -DestinationPath "dist\AAC_Assistant_Portable_$env:APP_VERSION.zip" -Force
          Get-Item "dist\AAC_Assistant_Portable_$env:APP_VERSION.zip" |
            ForEach-Object { Write-Host "Portable zip: $($_.Length) bytes" }

      - name: Portable smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist\AAC_Assistant\AAC_Assistant.exe'
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8086/api/health' -TimeoutSec 2
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if ($null -eq $health) { throw 'Packaged API did not become ready' }
            if ($health.version -ne $env:APP_VERSION) { throw "Unexpected packaged version: $($health.version)" }
            $index = Invoke-WebRequest 'http://127.0.0.1:8086/' -UseBasicParsing
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'AAC Assistant') { throw 'Packaged SPA smoke failed' }
            $asset = [regex]::Match($index.Content, '/assets/[A-Za-z0-9_.-]+\.js').Value
            if ([string]::IsNullOrEmpty($asset)) { throw 'Packaged SPA did not reference a JavaScript asset' }
            $assetResponse = Invoke-WebRequest ("http://127.0.0.1:8086" + $asset) -UseBasicParsing
            if ($assetResponse.StatusCode -ne 200) { throw "Packaged JavaScript asset failed: $asset" }
            Write-Host 'Packaged smoke passed.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Generate SBOM and SHA256 checksums
        # scripts/generate_sbom.py is the documented release step: it writes the
        # CycloneDX SBOM from the lockfiles and checksums every artifact in
        # dist/, so the automated release ships the same files as the runbook
        # (see docs/MAINTAINER_GUIDE.md, release checklist step 4).
        run: uv run python scripts/generate_sbom.py

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/AAC_Assistant_Setup_${APP_VERSION}.exe" \
            "dist/AAC_Assistant_Portable_${APP_VERSION}.zip" \
            "dist/SBOM.json" \
            "dist/SHA256SUMS.txt" \
            --title "AAC Assistant ${GITHUB_REF_NAME}" \
            --generate-notes
