[pytest]
testpaths = tests
addopts = -q
markers =
    voice: tests requiring the optional faster-whisper voice extra
filterwarnings =
    # Starlette's TestClient falls back to the repository-pinned httpx until
    # the project adopts the separate httpx2 package.
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace.*`:DeprecationWarning:pkg_resources.*
    ignore:.*builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:.*builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:.*builtin type swigvarlink has no __module__ attribute:DeprecationWarning
